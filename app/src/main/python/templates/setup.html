<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Initial Setup</title><link rel='manifest' href='{{ url_for("static", filename="app.webmanifest") }}'><link rel='icon' href='{{ url_for("static", filename="icon.svg") }}' type='image/svg+xml'><link rel='apple-touch-icon' href='{{ url_for("static", filename="apple-touch-icon.png") }}'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-title' content='V&F Pro'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'></head><body class="auth"><div class="authbox"><div class="brand">V<span>&</span>F Pro</div><h1 style="margin-top:22px">Create Admin</h1><p class="sub">প্রথমবার ব্যবহারের জন্য Admin account তৈরি করুন।</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash error">{{m}}</div>{% endfor %}{% endwith %}<form class="stack" method="post"><div class="field"><label>আপনার নাম</label><input name="full_name" required></div><div class="field"><label>Username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password (কমপক্ষে ৮ অক্ষর)</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary">Create Admin Account</button></form></div><script src='{{ url_for("static", filename="pwa.js") }}' defer></script></body></html>
