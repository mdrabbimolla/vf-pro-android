services:
  - type: web
    name: vf-pro-cloud
    runtime: python
    plan: starter
    rootDir: app/src/main/python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: vf-pro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TZ
        value: Asia/Dhaka
      - key: APP_DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_SECRET_KEY
        generateValue: true
