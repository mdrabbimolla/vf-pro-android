<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Login</title></head><body class="auth"><div class="authbox"><div class="brand">V<span>&</span>F Pro</div><h1 style="margin-top:22px">Welcome back</h1><p class="sub">আপনার Visit ও Follow-up workspace-এ লগইন করুন।</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{'error' if c=='error' else ''}}">{{m}}</div>{% endfor %}{% endwith %}<form class="stack" method="post"><div class="field"><label>Username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button class="btn primary">Sign in</button></form><p class="small" style="margin-top:18px">নতুন ইনস্টল হলে প্রথমে Admin Setup চালু হবে।</p></div></body></html>
